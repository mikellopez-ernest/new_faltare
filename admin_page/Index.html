<!doctype html>
<html lang="ca">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --line: #d7dde5;
      --accent: #1d4ed8;
      --danger: #b91c1c;
      --soft: #eef4ff;
    }

    * { box-sizing: border-box; }

    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.4;
    }

    body.modal-open { overflow: hidden; }

    main {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: min(1400px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0;
    }

    h1 {
      flex: 0 0 auto;
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 500;
    }

    .panel {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .filters {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px 18px;
      margin-bottom: 12px;
    }

    .filter-field {
      display: grid;
      gap: 5px;
      min-width: 210px;
    }

    .filter-field > span,
    .field-label {
      color: #475569;
      font-size: 13px;
      font-weight: 700;
    }

    .check-filter,
    .row-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .check-filter { min-height: 39px; }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #b8c2cf;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      letter-spacing: 0;
      padding: 8px 10px;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      padding: 0;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible,
    tr:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input:disabled,
    select:disabled,
    textarea:disabled {
      opacity: 1;
      background: #f8fafc;
      color: #334155;
      -webkit-text-fill-color: #334155;
    }

    textarea { min-height: 80px; resize: vertical; }
    .date-picker { position: relative; }

    .date-input-row {
      display: grid;
      grid-template-columns: 1fr 38px;
    }

    .date-input-row input {
      border-radius: 5px 0 0 5px;
      cursor: pointer;
    }

    .clear-date {
      border: 1px solid #b8c2cf;
      border-left: 0;
      border-radius: 0 5px 5px 0;
      background: #fff;
      color: #475569;
      padding: 0;
      font-size: 20px;
    }

    .calendar {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 20;
      width: 300px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
    }

    .calendar-head {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      margin-bottom: 8px;
    }

    .calendar-head strong { text-align: center; }

    .calendar-head button,
    .calendar-day {
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 6px;
      font-weight: 500;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .calendar-weekdays span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 0;
      text-align: center;
    }

    .calendar-day { aspect-ratio: 1; }
    .calendar-day:hover { background: var(--soft); }
    .calendar-day.selected { background: var(--accent); color: #fff; }
    .calendar-day.today { box-shadow: inset 0 0 0 1px var(--accent); }
    .calendar-day.empty { pointer-events: none; }

    .summary {
      flex: 0 0 auto;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 9px 16px;
    }

    button.secondary {
      border: 1px solid #b8c2cf;
      background: #fff;
      color: #334155;
    }

    button.danger { background: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: 0.6; }

    .message {
      flex: 0 0 auto;
      border-left: 4px solid var(--accent);
      background: var(--soft);
      margin: 0 0 12px;
      padding: 10px 12px;
    }

    .error {
      border-left-color: var(--danger);
      color: var(--danger);
      background: #fff1f2;
    }

    .hidden { display: none !important; }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
    }

    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    tbody tr[data-row-id] { cursor: pointer; }
    tbody tr[data-row-id]:hover { background: #f8fbff; }

    td:first-child,
    th:first-child { width: 48px; text-align: center; }

    .reason { min-width: 220px; max-width: 320px; }
    .context { min-width: 220px; max-width: 360px; white-space: pre-wrap; }
    a { color: var(--accent); font-weight: 600; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.56);
    }

    .modal {
      display: flex;
      flex-direction: column;
      width: min(1120px, 100%);
      max-height: calc(100vh - 36px);
      max-height: calc(100dvh - 36px);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-header h2 { margin: 0; font-size: 21px; }
    .modal-footer { justify-content: flex-end; border-top: 1px solid var(--line); border-bottom: 0; }

    .icon-button {
      width: 36px;
      height: 36px;
      background: transparent;
      color: #475569;
      padding: 0;
      font-size: 24px;
      line-height: 1;
    }

    .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }

    .modal-message { margin-bottom: 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .form-field { display: grid; align-content: start; gap: 5px; }
    .form-field.wide { grid-column: 1 / -1; }
    .form-field.checkbox-field { grid-template-columns: auto 1fr; align-items: center; }
    .form-field.checkbox-field .field-label { grid-column: 1 / -1; }
    .form-field.checkbox-field input { width: 18px; }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 10px;
    }

    .section-heading h3 { margin: 0; font-size: 18px; }
    .recovery-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
    .recovery-table { min-width: 620px; }
    .recovery-table th { position: static; }
    .recovery-table td:last-child,
    .recovery-table th:last-child { width: 90px; text-align: center; }
    .empty-state { color: var(--muted); text-align: center; padding: 20px; }

    @media (max-width: 820px) {
      main { width: min(100% - 18px, 1400px); padding: 10px 0; }
      h1 { margin-bottom: 8px; font-size: 26px; }
      .panel { padding: 10px; }
      .filters { gap: 8px 12px; }
      .filter-field { min-width: min(100%, 190px); flex: 1 1 190px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-field.wide { grid-column: auto; }
      .modal-backdrop { padding: 0; }
      .modal { width: 100%; max-height: 100vh; max-height: 100dvh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gestió de Faltaré</h1>

    <section class="panel">
      <div class="filters">
        <label class="filter-field">
          <span>Professor</span>
          <input id="teacherFilter" type="search" autocomplete="off" placeholder="Nom del professor">
        </label>

        <div class="filter-field date-picker" id="datePicker">
          <span>Data</span>
          <div class="date-input-row">
            <input id="dateFilterDisplay" type="text" lang="ca" inputmode="none" readonly placeholder="dd/mm/aaaa" aria-label="Filtra per data">
            <button class="clear-date" id="clearDateFilter" type="button" title="Esborra la data" aria-label="Esborra la data">×</button>
          </div>
          <div id="calendar" class="calendar hidden" aria-label="Calendari"></div>
        </div>

        <label class="check-filter"><input id="managedFilter" type="checkbox"><span>Gestionades</span></label>
        <label class="check-filter"><input id="recoverableFilter" type="checkbox" checked><span>Recuperables</span></label>
        <label class="check-filter"><input id="atriFilter" type="checkbox" checked><span>ATRI</span></label>
      </div>

      <p id="summary" class="summary">Carregant dades...</p>
      <div id="message" class="message hidden"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th></th>
              <th class="sortable" data-sort-key="absenceDate">Data absència</th>
              <th class="sortable" data-sort-key="teacherName">Professor</th>
              <th class="sortable" data-sort-key="reason">Motiu</th>
              <th class="sortable" data-sort-key="context">Context</th>
              <th class="sortable" data-sort-key="recoverableLabel">Recuperable?</th>
              <th class="sortable" data-sort-key="hours">Hores</th>
              <th class="sortable" data-sort-key="license">ATRI?</th>
              <th class="sortable" data-sort-key="documentUrl">Document</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="actions"><button type="button" id="managedButton" disabled>Gestionat</button></div>
    </section>
  </main>

  <div id="recordModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="recordModalTitle">
    <section class="modal">
      <header class="modal-header">
        <h2 id="recordModalTitle">Detall del registre</h2>
        <button type="button" class="icon-button" id="closeModalButton" title="Tanca" aria-label="Tanca">×</button>
      </header>
      <div class="modal-body">
        <div id="modalMessage" class="message modal-message hidden"></div>
        <div id="modalLoading">Carregant el registre...</div>
        <form id="recordForm" class="hidden">
          <div id="formFields" class="form-grid"></div>
          <div class="section-heading">
            <h3>Hores de recuperació</h3>
            <button type="button" class="secondary hidden" id="addRecoveryButton">Afegeix una fila</button>
          </div>
          <div class="recovery-table-wrap">
            <table class="recovery-table">
              <thead><tr><th>#</th><th>Data</th><th>Hora</th><th>Accions</th></tr></thead>
              <tbody id="recoveryBody"></tbody>
            </table>
          </div>
        </form>
      </div>
      <footer class="modal-footer">
        <button type="button" class="secondary hidden" id="cancelEditButton">Cancel·la</button>
        <button type="button" class="hidden" id="saveRecordButton">Desa</button>
        <button type="button" id="editRecordButton">Edita</button>
      </footer>
    </section>
  </div>

  <script>
    const FORM_FIELDS = [
      { key: 'row_id', label: 'ID del registre', protected: true },
      { key: 'created_at', label: 'Creat el', protected: true },
      { key: 'updated_at', label: 'Actualitzat el', protected: true },
      { key: 'adreca_electronica', label: 'Adreça electrònica', type: 'email' },
      { key: 'absence_teacher_name', label: 'Professor/a absent' },
      { key: 'absence_teacher_email', label: 'Correu del professor/a', type: 'email' },
      { key: 'teacher_code', label: 'Codi del professor/a' },
      { key: 'que_vols_fer', label: 'Acció sol·licitada', wide: true },
      { key: 'professor_acompanyant', label: 'Professor acompanyant', type: 'yesno' },
      { key: 'absence_date', label: 'Data d’absència', type: 'date' },
      { key: 'multi_day', label: 'Més d’un dia', type: 'yesno' },
      { key: 'reincorporation_date', label: 'Data de reincorporació', type: 'date' },
      { key: 'multi_day_student_work', label: 'Feina per a l’alumnat', type: 'textarea', wide: true },
      { key: 'motiu', label: 'Motiu', type: 'textarea', wide: true },
      { key: 'motiu_route', label: 'Ruta del motiu', type: 'route' },
      { key: 'context', label: 'Context', type: 'textarea', wide: true },
      { key: 'hores', label: 'Hores', type: 'number' },
      { key: 'hores_a_recuperar', label: 'Hores a recuperar', type: 'number' },
      { key: 'permis_llicencia_absencia', label: 'Permís, llicència o absència', wide: true },
      { key: 'document_file_id', label: 'ID del document' },
      { key: 'document_file_url', label: 'URL del document', type: 'url', wide: true },
      { key: 'document_file_name', label: 'Nom del document' },
      { key: 'confirmation_ok', label: 'Confirmació', type: 'boolean' },
      { key: 'status', label: 'Estat' },
      { key: 'managed', label: 'Gestionat', type: 'boolean' },
    ];

    const state = {
      rows: [],
      sortKey: '',
      sortDirection: 'asc',
      selectedRows: {},
      dateFilter: '',
      calendarMonth: startOfMonth(new Date()),
      activeRecord: null,
      editingRecord: false,
      savingRecord: false,
    };

    const el = {
      teacherFilter: document.getElementById('teacherFilter'),
      datePicker: document.getElementById('datePicker'),
      dateFilterDisplay: document.getElementById('dateFilterDisplay'),
      clearDateFilter: document.getElementById('clearDateFilter'),
      calendar: document.getElementById('calendar'),
      managedFilter: document.getElementById('managedFilter'),
      recoverableFilter: document.getElementById('recoverableFilter'),
      atriFilter: document.getElementById('atriFilter'),
      summary: document.getElementById('summary'),
      message: document.getElementById('message'),
      tableBody: document.getElementById('tableBody'),
      managedButton: document.getElementById('managedButton'),
      recordModal: document.getElementById('recordModal'),
      modalMessage: document.getElementById('modalMessage'),
      modalLoading: document.getElementById('modalLoading'),
      recordForm: document.getElementById('recordForm'),
      formFields: document.getElementById('formFields'),
      recoveryBody: document.getElementById('recoveryBody'),
      closeModalButton: document.getElementById('closeModalButton'),
      editRecordButton: document.getElementById('editRecordButton'),
      cancelEditButton: document.getElementById('cancelEditButton'),
      saveRecordButton: document.getElementById('saveRecordButton'),
      addRecoveryButton: document.getElementById('addRecoveryButton'),
    };

    init();

    function init() {
      bindEvents();
      loadData();
    }

    function bindEvents() {
      el.teacherFilter.addEventListener('input', render);
      [el.managedFilter, el.recoverableFilter, el.atriFilter].forEach((input) => input.addEventListener('change', render));
      el.dateFilterDisplay.addEventListener('click', toggleCalendar);
      el.clearDateFilter.addEventListener('click', clearDateFilter);
      el.calendar.addEventListener('click', handleCalendarClick);

      document.addEventListener('click', (event) => {
        if (!el.datePicker.contains(event.target)) el.calendar.classList.add('hidden');
      });

      document.querySelectorAll('th.sortable').forEach((header) => {
        header.dataset.baseLabel = header.textContent;
        header.addEventListener('click', () => sortBy(header.dataset.sortKey));
      });

      el.tableBody.addEventListener('change', handleRowSelection);
      el.tableBody.addEventListener('click', handleTableRowClick);
      el.tableBody.addEventListener('keydown', handleTableRowKeydown);
      el.managedButton.addEventListener('click', markSelectedRowsManaged);
      el.closeModalButton.addEventListener('click', closeRecordModal);
      el.recordModal.addEventListener('click', (event) => {
        if (event.target === el.recordModal) closeRecordModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !el.recordModal.classList.contains('hidden')) closeRecordModal();
      });

      el.editRecordButton.addEventListener('click', startEditingRecord);
      el.cancelEditButton.addEventListener('click', cancelEditingRecord);
      el.saveRecordButton.addEventListener('click', saveRecord);
      el.addRecoveryButton.addEventListener('click', addRecoveryRow);
      el.recoveryBody.addEventListener('click', (event) => {
        const button = event.target.closest('.remove-recovery');
        if (button) {
          button.closest('tr').remove();
          renumberRecoveryRows();
        }
      });
    }

    function loadData() {
      showMessage('Carregant dades...', 'loading');
      google.script.run
        .withSuccessHandler((data) => {
          state.rows = data.rows || [];
          state.selectedRows = {};
          clearMessage();
          render();
        })
        .withFailureHandler((error) => {
          state.rows = [];
          el.summary.textContent = 'No s\'han pogut carregar les dades.';
          showMessage(error.message || String(error), 'error');
          render();
        })
        .getAdminPageData();
    }

    function render() {
      const rows = getVisibleRows();
      el.summary.textContent = `${rows.length} registres visibles de ${state.rows.length} carregats`;

      if (!rows.length) {
        el.tableBody.innerHTML = '<tr><td colspan="9">No hi ha registres amb aquests filtres.</td></tr>';
        updateSortIndicators();
        updateActionState();
        return;
      }

      el.tableBody.innerHTML = rows.map((row) => `
        <tr data-row-id="${escapeAttribute(row.rowId)}" tabindex="0">
          <td><label class="row-check"><input class="row-select" type="checkbox" data-row-id="${escapeAttribute(row.rowId)}" ${state.selectedRows[row.rowId] ? 'checked' : ''} aria-label="Selecciona el registre"></label></td>
          <td>${escapeHtml(row.absenceDate)}</td>
          <td>${escapeHtml(row.teacherName)}</td>
          <td class="reason">${escapeHtml(row.reason)}</td>
          <td class="context">${escapeHtml(row.context)}</td>
          <td>${escapeHtml(row.recoverableLabel)}</td>
          <td>${escapeHtml(row.hours)}</td>
          <td>${escapeHtml(row.license)}</td>
          <td>${row.documentUrl ? `<a href="${escapeAttribute(row.documentUrl)}" target="_blank" rel="noopener">Obre</a>` : ''}</td>
        </tr>
      `).join('');

      updateSortIndicators();
      updateActionState();
    }

    function getVisibleRows() {
      const showManaged = el.managedFilter.checked;
      const showRecoverable = el.recoverableFilter.checked;
      const showAtri = el.atriFilter.checked;
      const teacherQuery = normalizeText(el.teacherFilter.value);

      let rows = state.rows.filter((row) => {
        if (Boolean(row.managed) !== showManaged) return false;
        if (!showRecoverable && row.route === 'J-b') return false;
        if (!showAtri && row.route === 'J-a') return false;
        if (teacherQuery && !normalizeText(row.teacherName).includes(teacherQuery)) return false;
        if (state.dateFilter && normalizeDateToIso(row.absenceDate) !== state.dateFilter) return false;
        return true;
      });

      if (!state.sortKey) return rows.slice().sort((a, b) => Number(a.dbOrder) - Number(b.dbOrder));
      rows = rows.slice().sort((a, b) => compareValues(a[state.sortKey], b[state.sortKey]));
      return state.sortDirection === 'desc' ? rows.reverse() : rows;
    }

    function sortBy(key) {
      if (state.sortKey === key) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
      else {
        state.sortKey = key;
        state.sortDirection = 'asc';
      }
      render();
    }

    function compareValues(a, b) {
      const numberA = Number(a);
      const numberB = Number(b);
      if (String(a).trim() !== '' && String(b).trim() !== '' && Number.isFinite(numberA) && Number.isFinite(numberB)) return numberA - numberB;
      return String(a || '').localeCompare(String(b || ''), 'ca', { numeric: true, sensitivity: 'base' });
    }

    function updateSortIndicators() {
      document.querySelectorAll('th.sortable').forEach((header) => {
        const active = header.dataset.sortKey === state.sortKey;
        header.textContent = active ? `${header.dataset.baseLabel} ${state.sortDirection === 'asc' ? '▲' : '▼'}` : header.dataset.baseLabel;
      });
    }

    function handleRowSelection(event) {
      if (!event.target.classList.contains('row-select')) return;
      state.selectedRows[event.target.dataset.rowId] = event.target.checked;
      updateActionState();
    }

    function handleTableRowClick(event) {
      if (event.target.closest('input, a, button, label')) return;
      const row = event.target.closest('tr[data-row-id]');
      if (row) openRecordModal(row.dataset.rowId);
    }

    function handleTableRowKeydown(event) {
      if (event.target.closest('input, a, button, label')) return;
      const row = event.target.closest('tr[data-row-id]');
      if (row && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openRecordModal(row.dataset.rowId);
      }
    }

    function markSelectedRowsManaged() {
      const selectedRowIds = getSelectedRowIds();
      if (!selectedRowIds.length) {
        showMessage('Cal seleccionar com a mínim un registre.', 'error');
        return;
      }

      el.managedButton.disabled = true;
      showMessage('Marcant registres com a gestionats...', 'loading');
      google.script.run
        .withSuccessHandler((result) => {
          selectedRowIds.forEach((rowId) => {
            state.selectedRows[rowId] = false;
            const row = state.rows.find((item) => String(item.rowId) === String(rowId));
            if (row) row.managed = true;
          });
          showMessage(`${result.updated} registres marcats com a gestionats.`, 'loading');
          render();
        })
        .withFailureHandler((error) => {
          showMessage(error.message || String(error), 'error');
          updateActionState();
        })
        .markRowsManaged(selectedRowIds);
    }

    function getSelectedRowIds() {
      return Object.keys(state.selectedRows).filter((rowId) => state.selectedRows[rowId]);
    }

    function updateActionState() {
      el.managedButton.disabled = !getSelectedRowIds().length;
    }

    function toggleCalendar() {
      el.calendar.classList.toggle('hidden');
      if (!el.calendar.classList.contains('hidden')) renderCalendar();
    }

    function clearDateFilter() {
      state.dateFilter = '';
      el.dateFilterDisplay.value = '';
      el.calendar.classList.add('hidden');
      render();
    }

    function renderCalendar() {
      const year = state.calendarMonth.getFullYear();
      const month = state.calendarMonth.getMonth();
      const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
      const dayCount = new Date(year, month + 1, 0).getDate();
      const today = toLocalIso(new Date());
      let days = '';

      for (let index = 0; index < firstWeekday; index += 1) days += '<span class="calendar-day empty"></span>';
      for (let day = 1; day <= dayCount; day += 1) {
        const iso = `${year}-${pad2(month + 1)}-${pad2(day)}`;
        const classes = ['calendar-day'];
        if (iso === state.dateFilter) classes.push('selected');
        if (iso === today) classes.push('today');
        days += `<button type="button" class="${classes.join(' ')}" data-date="${iso}">${day}</button>`;
      }

      const monthLabel = new Intl.DateTimeFormat('ca-ES', { month: 'long', year: 'numeric' }).format(state.calendarMonth);
      el.calendar.innerHTML = `
        <div class="calendar-head">
          <button type="button" data-calendar-action="previous" aria-label="Mes anterior">‹</button>
          <strong>${escapeHtml(capitalize(monthLabel))}</strong>
          <button type="button" data-calendar-action="next" aria-label="Mes següent">›</button>
        </div>
        <div class="calendar-weekdays"><span>Dl</span><span>Dt</span><span>Dc</span><span>Dj</span><span>Dv</span><span>Ds</span><span>Dg</span></div>
        <div class="calendar-days">${days}</div>
      `;
    }

    function handleCalendarClick(event) {
      const actionButton = event.target.closest('[data-calendar-action]');
      if (actionButton) {
        const offset = actionButton.dataset.calendarAction === 'next' ? 1 : -1;
        state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + offset, 1);
        renderCalendar();
        return;
      }

      const dayButton = event.target.closest('[data-date]');
      if (dayButton) {
        state.dateFilter = dayButton.dataset.date;
        el.dateFilterDisplay.value = formatCatalanDate(state.dateFilter);
        el.calendar.classList.add('hidden');
        render();
      }
    }

    function openRecordModal(rowId) {
      state.activeRecord = null;
      state.editingRecord = false;
      state.savingRecord = false;
      el.recordModal.classList.remove('hidden');
      document.body.classList.add('modal-open');
      el.modalLoading.classList.remove('hidden');
      el.recordForm.classList.add('hidden');
      el.editRecordButton.classList.add('hidden');
      el.cancelEditButton.classList.add('hidden');
      el.saveRecordButton.classList.add('hidden');
      clearModalMessage();

      google.script.run
        .withSuccessHandler((record) => {
          state.activeRecord = record;
          el.modalLoading.classList.add('hidden');
          el.recordForm.classList.remove('hidden');
          renderRecordModal();
        })
        .withFailureHandler((error) => {
          el.modalLoading.classList.add('hidden');
          showModalMessage(error.message || String(error), 'error');
        })
        .getAdminRecord(rowId);
    }

    function closeRecordModal() {
      if (state.savingRecord) return;
      el.recordModal.classList.add('hidden');
      document.body.classList.remove('modal-open');
      state.activeRecord = null;
      state.editingRecord = false;
    }

    function renderRecordModal() {
      if (!state.activeRecord) return;
      el.formFields.innerHTML = FORM_FIELDS.map((field) => renderFormField(field, state.activeRecord.formData[field.key])).join('');
      renderRecoveryRows(state.activeRecord.recoveryRows || []);
      el.editRecordButton.classList.toggle('hidden', state.editingRecord);
      el.cancelEditButton.classList.toggle('hidden', !state.editingRecord);
      el.saveRecordButton.classList.toggle('hidden', !state.editingRecord);
      el.addRecoveryButton.classList.toggle('hidden', !state.editingRecord);
    }

    function renderFormField(field, rawValue) {
      const value = rawValue === null || rawValue === undefined ? '' : String(rawValue);
      const disabled = !state.editingRecord || field.protected;
      const classes = ['form-field'];
      if (field.wide) classes.push('wide');
      if (field.type === 'boolean') classes.push('checkbox-field');
      let control;

      if (field.type === 'textarea') control = `<textarea data-form-field="${field.key}" ${disabled ? 'disabled' : ''}>${escapeHtml(value)}</textarea>`;
      else if (field.type === 'yesno') control = renderSelect(field.key, value, ['', 'Sí', 'No'], disabled);
      else if (field.type === 'route') control = renderSelect(field.key, value, ['', 'J-a', 'J-b'], disabled);
      else if (field.type === 'boolean') control = `<input data-form-field="${field.key}" type="checkbox" ${isTruthy(value) ? 'checked' : ''} ${disabled ? 'disabled' : ''}>`;
      else {
        const inputValue = field.type === 'date' ? normalizeDateToIso(value) : value;
        control = `<input data-form-field="${field.key}" type="${field.type || 'text'}" value="${escapeAttribute(inputValue)}" ${disabled ? 'disabled' : ''}>`;
      }

      const documentLink = field.key === 'document_file_url' && value
        ? `<a href="${escapeAttribute(value)}" target="_blank" rel="noopener">Obre el document</a>`
        : '';
      return `<label class="${classes.join(' ')}"><span class="field-label">${escapeHtml(field.label)}</span>${control}${documentLink}</label>`;
    }

    function renderSelect(key, value, options, disabled) {
      return `<select data-form-field="${key}" ${disabled ? 'disabled' : ''}>${options.map((option) => `<option value="${escapeAttribute(option)}" ${option === value ? 'selected' : ''}>${escapeHtml(option || '—')}</option>`).join('')}</select>`;
    }

    function renderRecoveryRows(rows) {
      if (!rows.length) {
        el.recoveryBody.innerHTML = '<tr class="recovery-empty"><td colspan="4" class="empty-state">No hi ha hores de recuperació.</td></tr>';
        return;
      }
      el.recoveryBody.innerHTML = rows.map((row, index) => recoveryRowHtml(row, index)).join('');
    }

    function recoveryRowHtml(row, index) {
      const disabled = state.editingRecord ? '' : 'disabled';
      return `
        <tr class="recovery-row">
          <td class="recovery-index">${index + 1}</td>
          <td><input class="recovery-date" type="date" lang="ca" value="${escapeAttribute(normalizeDateToIso(row.date))}" required ${disabled}></td>
          <td><input class="recovery-time" type="time" value="${escapeAttribute(normalizeTime(row.time))}" required ${disabled}></td>
          <td><button type="button" class="danger remove-recovery ${state.editingRecord ? '' : 'hidden'}">Elimina</button></td>
        </tr>`;
    }

    function startEditingRecord() {
      state.editingRecord = true;
      clearModalMessage();
      renderRecordModal();
    }

    function cancelEditingRecord() {
      state.editingRecord = false;
      clearModalMessage();
      renderRecordModal();
    }

    function addRecoveryRow() {
      const empty = el.recoveryBody.querySelector('.recovery-empty');
      if (empty) empty.remove();
      const index = el.recoveryBody.querySelectorAll('.recovery-row').length;
      el.recoveryBody.insertAdjacentHTML('beforeend', recoveryRowHtml({ date: '', time: '' }, index));
    }

    function renumberRecoveryRows() {
      const rows = el.recoveryBody.querySelectorAll('.recovery-row');
      rows.forEach((row, index) => { row.querySelector('.recovery-index').textContent = index + 1; });
      if (!rows.length) el.recoveryBody.innerHTML = '<tr class="recovery-empty"><td colspan="4" class="empty-state">No hi ha hores de recuperació.</td></tr>';
    }

    function saveRecord() {
      if (!state.activeRecord || state.savingRecord || !el.recordForm.reportValidity()) return;
      const formData = {};
      FORM_FIELDS.forEach((field) => {
        const control = el.formFields.querySelector(`[data-form-field="${field.key}"]`);
        formData[field.key] = field.type === 'boolean' ? control.checked : control.value;
      });

      const recoveryRows = Array.from(el.recoveryBody.querySelectorAll('.recovery-row')).map((row) => ({
        date: row.querySelector('.recovery-date').value,
        time: row.querySelector('.recovery-time').value,
      }));

      state.savingRecord = true;
      el.saveRecordButton.disabled = true;
      el.cancelEditButton.disabled = true;
      showModalMessage('Desant els canvis...', 'loading');
      google.script.run
        .withSuccessHandler((result) => {
          state.activeRecord = result.record;
          state.editingRecord = false;
          state.savingRecord = false;
          el.saveRecordButton.disabled = false;
          el.cancelEditButton.disabled = false;
          renderRecordModal();
          showModalMessage('Canvis desats correctament.', 'loading');
          loadData();
        })
        .withFailureHandler((error) => {
          state.savingRecord = false;
          el.saveRecordButton.disabled = false;
          el.cancelEditButton.disabled = false;
          showModalMessage(error.message || String(error), 'error');
        })
        .saveAdminRecord({ rowId: state.activeRecord.rowId, formData: formData, recoveryRows: recoveryRows });
    }

    function showMessage(message, type) {
      el.message.textContent = message;
      el.message.classList.remove('hidden', 'error');
      if (type === 'error') el.message.classList.add('error');
    }

    function clearMessage() {
      el.message.textContent = '';
      el.message.classList.add('hidden');
      el.message.classList.remove('error');
    }

    function showModalMessage(message, type) {
      el.modalMessage.textContent = message;
      el.modalMessage.classList.remove('hidden', 'error');
      if (type === 'error') el.modalMessage.classList.add('error');
    }

    function clearModalMessage() {
      el.modalMessage.textContent = '';
      el.modalMessage.classList.add('hidden');
      el.modalMessage.classList.remove('error');
    }

    function normalizeText(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('ca');
    }

    function normalizeDateToIso(value) {
      const raw = String(value || '').trim();
      const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
      const catalanMatch = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
      if (catalanMatch) return `${catalanMatch[3]}-${pad2(catalanMatch[2])}-${pad2(catalanMatch[1])}`;
      return '';
    }

    function formatCatalanDate(isoDate) {
      const parts = String(isoDate || '').split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : '';
    }

    function normalizeTime(value) {
      const match = String(value || '').trim().match(/^(\d{1,2}):(\d{2})/);
      return match ? `${pad2(match[1])}:${match[2]}` : '';
    }

    function startOfMonth(date) { return new Date(date.getFullYear(), date.getMonth(), 1); }
    function toLocalIso(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }
    function pad2(value) { return String(value).padStart(2, '0'); }
    function capitalize(value) { return value ? value.charAt(0).toLocaleUpperCase('ca') + value.slice(1) : ''; }
    function isTruthy(value) { return ['true', 'sí', 'si', '1', 'yes'].includes(normalizeText(value)); }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
  </script>
</body>
</html>
